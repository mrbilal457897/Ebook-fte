[project]
name = "orchestrator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Muhammad Bilal", email = "163662455+mrbilal457897@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "content-agent",
    "fastapi==0.133.1",
    "google-adk==2.9.2",
    "psycopg-pool==3.3.2",
    "psycopg[binary]==3.3.6",
    "uvicorn==0.34.2",
]

[tool.uv.sources]
content-agent = { path = "../content-agent", editable = true }

[project.scripts]
orchestrator = "orchestrator:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
